[project]
name = "evaluation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "choix>=0.4.1",
    "krippendorff>=0.8.2",
    "matplotlib>=3.10.6",
    "networkx>=3.6.1",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
]

[project.scripts]
save_to_correct_dirs = "model2model.unfinished.saving_results_to_correct_dirs:main"


[tool.uv]
package = true

[tool.uv.sources]
persuasio = { path = "../persuasio", editable = true }

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]
