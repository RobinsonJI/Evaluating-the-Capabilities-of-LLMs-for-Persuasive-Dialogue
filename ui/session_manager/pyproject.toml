[project]
name = "persuasui-session-manager"
version = "0.1.0"
description = "Session Manager Service for Persuasive Dialogue UI Platform"

requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.121.2",
    "httpx>=0.25.0",
    "pydantic>=2.12.4",
    "gunicorn>=21.0.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0.3",
    "psycopg2>=2.9.11",
    "psycopg[binary,pool]>=3.2.12",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
]

[project.scripts]
exp_setup = "session_manager.setup.pipeline:main"
exp_setup_db = "session_manager.setup.pipeline:main_with_db"
