[project]
name = "persuasui"
version = "0.1.0"
description = "Platform for Persuasive Dialogue System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

# [tool.uv.workspace]
# members = ["session_manager", "client"]

[tool.uv.sources]
persuasui-shared = { path = "shared", editable = true }
